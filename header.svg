<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" height="290">
  <style>
    .mono{font-family:'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace}
    .l{opacity:0;animation:in .01s forwards}
    @keyframes in{to{opacity:1}}
    .type{clip-path:inset(0 100% 0 0);animation:type 1.1s steps(28) forwards}
    @keyframes type{to{clip-path:inset(0 0 0 0)}}
    .cur{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
  </style>
  <rect x="1" y="1" width="898" height="288" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <rect x="1" y="1" width="898" height="40" rx="14" fill="#161b22"/>
  <rect x="1" y="27" width="898" height="14" fill="#161b22"/>
  <line x1="1" y1="41" x2="899" y2="41" stroke="#30363d" stroke-width="1"/>
  <circle cx="26" cy="21" r="7" fill="#ff5f57"/><circle cx="48" cy="21" r="7" fill="#febc2e"/><circle cx="70" cy="21" r="7" fill="#28c840"/>
  <text x="450" y="26" text-anchor="middle" class="mono" font-size="13" fill="#8b949e">percy@sydney: ~</text>

  <g class="mono" font-size="17">
    <g class="type" style="animation-delay:.3s"><text x="32" y="80"><tspan fill="#7ee787">$</tspan><tspan fill="#79c0ff"> ~</tspan><tspan fill="#e6edf3"> whoami</tspan></text></g>
    <g class="l" style="animation-delay:1.5s">
      <text x="32" y="124" font-size="34" font-weight="700" fill="#e6edf3">Percy Kim</text>
      <text x="32" y="156" fill="#a5a3ff">AI student @ UTS  ·  Python · Java · SQL</text>
    </g>
    <g class="type" style="animation-delay:2.4s"><text x="32" y="204"><tspan fill="#7ee787">$</tspan><tspan fill="#79c0ff"> ~</tspan><tspan fill="#e6edf3"> ls ./projects</tspan></text></g>
    <g class="l" style="animation-delay:3.6s">
      <text x="32" y="246" font-size="17" fill="#e6edf3">qubird/</text>
      <text x="120" y="246" font-size="15" fill="#8b949e">a game powered by real quantum circuits · Python + Qiskit</text>
      <rect class="cur" x="640" y="231" width="10" height="20" fill="#e6edf3"/>
    </g>
  </g>
</svg>
